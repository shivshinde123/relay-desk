<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Relay Desk architecture diagram" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<title>Relay Desk architecture diagram</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#17214a"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4df0c8"/><stop offset="1" stop-color="#5ab8ff"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b4d6"/></marker>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="40" y="56" fill="#eaf0ff" font-size="26" font-weight="800">Relay Desk architecture</text><text x="40" y="82" fill="#a9b4d6" font-size="14">One Express server hosts the API, live updates and the static frontend.</text><rect x="30" y="110" width="300" height="470" rx="20" fill="none" stroke="#2c3869" stroke-width="1.5" stroke-dasharray="3 6"/><text x="48" y="136" fill="#a9b4d6" font-size="13" font-weight="600">Browser</text><rect x="55" y="150" width="250" height="76" rx="16" fill="#141c3f" stroke="#4df0c8" stroke-opacity=".7" stroke-width="1.5"/><text x="180.0" y="184.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Landing page</text><text x="180.0" y="204.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">3D hero, chat widget</text><rect x="55" y="260" width="250" height="76" rx="16" fill="#141c3f" stroke="#5ab8ff" stroke-opacity=".7" stroke-width="1.5"/><text x="180.0" y="294.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Customer portal</text><text x="180.0" y="314.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">Live AI category hint</text><rect x="55" y="370" width="250" height="76" rx="16" fill="#141c3f" stroke="#ffb84d" stroke-opacity=".7" stroke-width="1.5"/><text x="180.0" y="404.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Agent desk</text><text x="180.0" y="424.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">Queue, SLA timers, analytics</text><text x="180" y="500" fill="#a9b4d6" font-size="12.5" text-anchor="middle">HTML, CSS, JavaScript</text><text x="180" y="520" fill="#a9b4d6" font-size="12.5" text-anchor="middle">Three.js, Vanilla-Tilt</text><rect x="400" y="110" width="470" height="470" rx="20" fill="none" stroke="#2c3869" stroke-width="1.5" stroke-dasharray="3 6"/><text x="418" y="136" fill="#a9b4d6" font-size="13" font-weight="600">Express server (Node.js)</text><rect x="425" y="150" width="200" height="60" rx="16" fill="#141c3f" stroke="#8f7dff" stroke-opacity=".7" stroke-width="1.5"/><text x="525.0" y="176.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Auth</text><text x="525.0" y="196.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">JWT + bcrypt</text><rect x="645" y="150" width="200" height="60" rx="16" fill="#141c3f" stroke="#8f7dff" stroke-opacity=".7" stroke-width="1.5"/><text x="745.0" y="176.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Tickets API</text><text x="745.0" y="196.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">create, list, update</text><rect x="425" y="235" width="420" height="60" rx="16" fill="#141c3f" stroke="#8f7dff" stroke-opacity=".7" stroke-width="1.5"/><text x="635.0" y="261.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Middleware</text><text x="635.0" y="281.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">Helmet, CORS, rate limits, role checks</text><rect x="425" y="330" width="130" height="76" rx="16" fill="#141c3f" stroke="#5ab8ff" stroke-opacity=".7" stroke-width="1.5"/><text x="490.0" y="364.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Router</text><text x="490.0" y="384.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">best agent</text><rect x="570" y="330" width="130" height="76" rx="16" fill="#141c3f" stroke="#ffb84d" stroke-opacity=".7" stroke-width="1.5"/><text x="635.0" y="364.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">SLA service</text><text x="635.0" y="384.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">deadlines, pauses</text><rect x="715" y="330" width="130" height="76" rx="16" fill="#141c3f" stroke="#4df0c8" stroke-opacity=".7" stroke-width="1.5"/><text x="780.0" y="364.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">AI classifier</text><text x="780.0" y="384.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">category, mood</text><rect x="425" y="440" width="200" height="60" rx="16" fill="#141c3f" stroke="#4df0c8" stroke-opacity=".7" stroke-width="1.5"/><text x="525.0" y="466.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">Socket.IO</text><text x="525.0" y="486.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">live ticket events</text><rect x="645" y="440" width="200" height="60" rx="16" fill="#141c3f" stroke="#ffb84d" stroke-opacity=".7" stroke-width="1.5"/><text x="745.0" y="466.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">SLA monitor</text><text x="745.0" y="486.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">cron, every minute</text><rect x="940" y="110" width="230" height="230" rx="20" fill="none" stroke="#2c3869" stroke-width="1.5" stroke-dasharray="3 6"/><text x="958" y="136" fill="#a9b4d6" font-size="13" font-weight="600">Data</text><rect x="965" y="150" width="180" height="150" rx="16" fill="#141c3f" stroke="#4df0c8" stroke-opacity=".7" stroke-width="1.5"/><text x="1055.0" y="221.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">MySQL 8</text><text x="1055.0" y="241.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">users, tickets, SLA logs</text><text x="1055" y="262" fill="#a9b4d6" font-size="12.5" text-anchor="middle">assignments, AI logs</text><rect x="965" y="400" width="180" height="76" rx="16" fill="#141c3f" stroke="#8f7dff" stroke-opacity=".7" stroke-width="1.5"/><text x="1055.0" y="434.0" fill="#eaf0ff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">OpenAI API</text><text x="1055.0" y="454.0" fill="#a9b4d6" font-size="12.5" text-anchor="middle">optional</text><line x1="330" y1="300" x2="400" y2="300" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="365.0" y="292.0" fill="#a9b4d6" font-size="12" text-anchor="middle">REST + JSON</text><line x1="870" y1="225" x2="940" y2="225" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="905.0" y="217.0" fill="#a9b4d6" font-size="12" text-anchor="middle">mysql2 pool</text><line x1="845" y1="372" x2="965" y2="436" stroke="#a9b4d6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="425" y1="470" x2="330" y2="470" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)"/><text x="377.5" y="462.0" fill="#a9b4d6" font-size="12" text-anchor="middle">live events</text><line x1="845" y1="455" x2="960" y2="300" stroke="#a9b4d6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="40" y="616" fill="#a9b4d6" font-size="13">If the OpenAI call fails or no key is set, the built-in rule engine classifies the ticket instead.</text>
</svg>