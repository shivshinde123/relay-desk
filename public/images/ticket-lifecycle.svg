<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="Ticket lifecycle diagram" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<title>Ticket lifecycle diagram</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#17214a"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4df0c8"/><stop offset="1" stop-color="#5ab8ff"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b4d6"/></marker>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<text x="40" y="56" fill="#eaf0ff" font-size="26" font-weight="800">Life of a ticket</text><text x="40" y="82" fill="#a9b4d6" font-size="14">Steps one to four happen in a single request, in milliseconds.</text><rect x="40" y="130" width="170" height="120" rx="18" fill="#141c3f" stroke="#5ab8ff" stroke-opacity=".8" stroke-width="1.6"/><circle cx="66" cy="158" r="5" fill="#5ab8ff"/><text x="80" y="163" fill="#eaf0ff" font-size="17" font-weight="700">Created</text><text x="60" y="198" fill="#a9b4d6" font-size="13">Customer sends a</text><text x="60" y="218" fill="#a9b4d6" font-size="13">ticket</text><line x1="211" y1="190" x2="226" y2="190" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)"/><rect x="227" y="130" width="170" height="120" rx="18" fill="#141c3f" stroke="#4df0c8" stroke-opacity=".8" stroke-width="1.6"/><circle cx="253" cy="158" r="5" fill="#4df0c8"/><text x="267" y="163" fill="#eaf0ff" font-size="17" font-weight="700">AI analysis</text><text x="247" y="198" fill="#a9b4d6" font-size="13">Category, priority, mood</text><line x1="398" y1="190" x2="413" y2="190" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)"/><rect x="414" y="130" width="170" height="120" rx="18" fill="#141c3f" stroke="#ffb84d" stroke-opacity=".8" stroke-width="1.6"/><circle cx="440" cy="158" r="5" fill="#ffb84d"/><text x="454" y="163" fill="#eaf0ff" font-size="17" font-weight="700">SLA set</text><text x="434" y="198" fill="#a9b4d6" font-size="13">Deadlines from priority</text><line x1="585" y1="190" x2="600" y2="190" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)"/><rect x="601" y="130" width="170" height="120" rx="18" fill="#141c3f" stroke="#8f7dff" stroke-opacity=".8" stroke-width="1.6"/><circle cx="627" cy="158" r="5" fill="#8f7dff"/><text x="641" y="163" fill="#eaf0ff" font-size="17" font-weight="700">Routed</text><text x="621" y="198" fill="#a9b4d6" font-size="13">Specialist with lightest</text><text x="621" y="218" fill="#a9b4d6" font-size="13">queue</text><line x1="772" y1="190" x2="787" y2="190" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)"/><rect x="788" y="130" width="170" height="120" rx="18" fill="#141c3f" stroke="#5ab8ff" stroke-opacity=".8" stroke-width="1.6"/><circle cx="814" cy="158" r="5" fill="#5ab8ff"/><text x="828" y="163" fill="#eaf0ff" font-size="17" font-weight="700">In progress</text><text x="808" y="198" fill="#a9b4d6" font-size="13">Agent replies, timers</text><text x="808" y="218" fill="#a9b4d6" font-size="13">run</text><line x1="959" y1="190" x2="974" y2="190" stroke="#a9b4d6" stroke-width="1.8" marker-end="url(#arr)"/><rect x="975" y="130" width="170" height="120" rx="18" fill="#141c3f" stroke="#4df0c8" stroke-opacity=".8" stroke-width="1.6"/><circle cx="1001" cy="158" r="5" fill="#4df0c8"/><text x="1015" y="163" fill="#eaf0ff" font-size="17" font-weight="700">Resolved</text><text x="995" y="198" fill="#a9b4d6" font-size="13">Resolution time saved</text><rect x="601" y="290" width="357" height="64" rx="16" fill="none" stroke="#ffb84d" stroke-dasharray="5 5"/><text x="779.5" y="318" fill="#ffb84d" font-size="14" font-weight="700" text-anchor="middle">Waiting on customer</text><text x="779.5" y="338" fill="#a9b4d6" font-size="12.5" text-anchor="middle">SLA clock pauses, deadline shifts on resume</text><rect x="40" y="290" width="544" height="64" rx="16" fill="none" stroke="#ff6b7a" stroke-dasharray="5 5"/><text x="312.0" y="318" fill="#ff6b7a" font-size="14" font-weight="700" text-anchor="middle">SLA monitor, every minute</text><text x="312.0" y="338" fill="#a9b4d6" font-size="12.5" text-anchor="middle">Warns at 75% and 90%, marks a breach when the deadline passes</text>
</svg>